<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
AI Organization v3
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f14;
  color: #e8edf3;
  font-family:
    system-ui,
    -apple-system,
    sans-serif;
}

header {
  height: 60px;

  padding:
    0 18px;

  border-bottom:
    1px solid #252c35;

  display: flex;

  align-items: center;

  justify-content:
    space-between;
}

main {
  max-width: 1000px;

  margin:
    auto;

  padding:
    20px;
}

.panel {
  border:
    1px solid #29313b;

  background:
    #121820;

  border-radius:
    14px;

  padding:
    15px;

  margin-bottom:
    15px;
}

textarea {
  width: 100%;

  min-height:
    120px;

  resize:
    vertical;

  background:
    #0d1218;

  color:
    white;

  border:
    1px solid #2b3440;

  border-radius:
    10px;

  padding:
    12px;

  font:
    inherit;
}

button {
  border:
    0;

  border-radius:
    9px;

  padding:
    10px 15px;

  background:
    #2764d8;

  color:
    white;

  cursor:
    pointer;

  margin:
    6px 6px 0 0;
}

button.stop {
  background:
    #9b3b3b;
}

.owner {
  display:
    none;

  border:
    1px solid #80651e;

  background:
    #1c180d;
}

.status {
  line-height:
    1.8;

  font-size:
    14px;
}

.log {
  max-height:
    420px;

  overflow:
    auto;

  white-space:
    pre-wrap;

  font-size:
    12px;

  color:
    #aeb8c5;
}

.badge {
  display:
    inline-block;

  padding:
    3px 8px;

  border-radius:
    999px;

  background:
    #202a35;

  font-size:
    12px;
}

</style>

</head>

<body>

<header>

<b>
AI Organization · GPT-OSS 120B
</b>

<span class="badge">
LEVEL 3 · OWNER
</span>

</header>

<main>

<div class="panel">

<h3>
Task
</h3>

<textarea
  id="task"
  placeholder="Tell the AI team what to do..."
></textarea>

<br>

<button
  onclick="startTask()"
>
Start Task
</button>

</div>

<div class="panel">

<h3>
Status
</h3>

<div
  class="status"
  id="status"
>
Loading...
</div>

</div>

<div
  class="panel owner"
  id="owner"
>

<h3>
👑 Owner decision required
</h3>

<p id="ownerText">

The current execution budget has
been exhausted.

Continue?

</p>

<button
  onclick="decision('continue')"
>
Continue another 8 cycles
</button>

<button
  class="stop"
  onclick="decision('stop')"
>
Stop
</button>

</div>

<div class="panel">

<h3>
Activity
</h3>

<div
  class="log"
  id="log"
>
Loading...
</div>

</div>

</main>

<script>

function escapeHtml(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

}

async function getState() {

  const response =
    await fetch("/api/state");

  return response.json();

}

async function refresh() {

  try {

    const data =
      await getState();

    document.getElementById(
      "status"
    ).innerHTML = `

      Status:
      <b>${escapeHtml(data.status)}</b>

      <br>

      Cycle:
      <b>
        ${data.cycle}/${data.maxCycles}
      </b>

      <br>

      Worker:
      <b>
        ${escapeHtml(data.workerStatus)}
      </b>

      <br>

      Manager:
      <b>
        ${escapeHtml(data.managerStatus)}
      </b>

      <br><br>

      <b>Worker:</b>

      <br>

      ${escapeHtml(data.workerMessage)}

      <br><br>

      <b>Manager:</b>

      <br>

      ${escapeHtml(data.managerMessage)}

    `;

    document.getElementById(
      "owner"
    ).style.display =
      data.awaitingOwner
        ? "block"
        : "none";

    document.getElementById(
      "log"
    ).textContent =
      data.events
        .map(
          event =>
            `[${new Date(
              event.time
            ).toLocaleTimeString()}] ` +
            `${event.type}/${event.actor}: ` +
            event.message
        )
        .join("\n");

  } catch (error) {

    document.getElementById(
      "status"
    ).textContent =
      error.message;

  }

}

async function startTask() {

  const task =
    document
      .getElementById("task")
      .value
      .trim();

  if (!task) {
    return;
  }

  const response =
    await fetch(
      "/api/task",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            task
          })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {
    alert(data.error);
  }

  refresh();

}

async function decision(value) {

  const response =
    await fetch(
      "/api/owner/decision",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            decision: value
          })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {
    alert(data.error);
  }

  refresh();

}

refresh();

setInterval(
  refresh,
  1500
);

</script>

</body>

</html>
