<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Organization</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#e9edf2;font-family:system-ui,sans-serif}header{height:60px;padding:0 18px;border-bottom:1px solid #252b34;display:flex;align-items:center;justify-content:space-between;background:#10141a}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 60px)}aside{border-right:1px solid #252b34;padding:16px;background:#0e1217}.card{border:1px solid #272e38;border-radius:12px;padding:12px;margin-bottom:12px;background:#12171d}.agent{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222832}.status{font-size:11px;padding:3px 7px;border-radius:999px;background:#202733}main{display:flex;flex-direction:column;height:calc(100vh - 60px)}#chat{flex:1;overflow:auto;padding:22px;max-width:1000px;width:100%;margin:auto}.msg{margin:0 auto 14px;max-width:900px}.bubble{padding:12px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#2357c6}.agent{background:#171d25;border:1px solid #29313c}.composer{padding:14px;border-top:1px solid #252b34}.box{max-width:900px;margin:auto;display:flex;gap:8px}.box textarea{flex:1;background:#151b22;color:white;border:1px solid #2a323d;border-radius:10px;padding:12px;resize:none;min-height:48px}button{border:0;border-radius:9px;background:#2357c6;color:white;padding:10px 14px;cursor:pointer}pre{white-space:pre-wrap;font-size:11px;max-height:280px;overflow:auto}</style></head><body><header><b>AI Organization · GPT-OSS 120B</b><button onclick="control('terminate')">Terminate</button></header><div class="layout"><aside><div class="card"><b>LEVEL 3 · OWNER</b><div class="agent">You <span class="status">highest</span></div></div><div class="card"><b>LEVEL 2 · MANAGERS</b><div id="managers"></div></div><div class="card"><b>LEVEL 1 · WORKERS</b><div id="workers"></div></div><div class="card"><b>Activity</b><pre id="events">Loading...</pre></div></aside><main><div id="chat"><div class="msg"><div class="bubble agent">Organization online. You are the Owner. Give the team a task.</div></div></div><div class="composer"><div class="box"><textarea id="input" placeholder="Give the organization a task..."></textarea><button onclick="send()">Send</button></div></div></main></div><script>const sid=crypto.randomUUID(),chat=document.getElementById('chat');function add(t,c){const d=document.createElement('div');d.className='msg';const b=document.createElement('div');b.className='bubble '+c;b.textContent=t;d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){const i=document.getElementById('input'),t=i.value.trim();if(!t)return;i.value='';add(t,'user');add('Organization is working...','agent');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid,message:t})}),d=await r.json();chat.lastElementChild.remove();add(d.reports?.map(x=>`${x.workerId} → ${x.managerId}\nWORK: ${x.result}\nREVIEW: ${x.review.decision}`).join('\n\n')||d.error,'agent');refresh()}catch(e){chat.lastElementChild.remove();add('Error: '+e.message,'agent')}}async function control(action,workerId){await fetch('/api/owner/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,workerId})});refresh()}async function refresh(){const d=await(await fetch('/api/state')).json();document.getElementById('managers').innerHTML=d.managers.map(x=>`<div class="agent">${x.id}<span class="status">${x.status}</span></div>`).join('');document.getElementById('workers').innerHTML=d.workers.map(x=>`<div class="agent">${x.id}<span><span class="status">${x.status}</span> <button onclick="control('${x.status==='paused'?'resume_worker':'pause_worker'}','${x.id}')">${x.status==='paused'?'Resume':'Pause'}</button></span></div>`).join('');document.getElementById('events').textContent=d.events.map(e=>`[${new Date(e.time).toLocaleTimeString()}] ${e.type} ${e.actor}: ${e.message}`).join('\n')}refresh();setInterval(refresh,2000);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});</script></body></html>
