<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Peer Organization</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf3;font-family:system-ui,-apple-system,sans-serif}header{height:60px;padding:0 18px;border-bottom:1px solid #252c35;display:flex;align-items:center;justify-content:space-between}main{max-width:1100px;margin:auto;padding:20px}.panel{border:1px solid #29313b;background:#121820;border-radius:14px;padding:15px;margin-bottom:15px}textarea,input{width:100%;background:#0d1218;color:white;border:1px solid #2b3440;border-radius:10px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}input{margin-bottom:10px}button{border:0;border-radius:9px;padding:10px 15px;background:#2764d8;color:white;cursor:pointer;margin:6px 6px 0 0}button.stop{background:#9b3b3b}button.secondary{background:#394554}.owner{display:none;border:1px solid #80651e;background:#1c180d}.status{line-height:1.8;font-size:14px}.log{max-height:420px;overflow:auto;white-space:pre-wrap;font-size:12px;color:#aeb8c5}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#202a35;font-size:12px}.login{max-width:420px;margin:12vh auto}.danger{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>AI Peer Organization</b><span class="badge">TWO INDEPENDENT WORKERS</span></header>

<section id="loginView" class="login panel">
<h2>Owner Login</h2>
<p>Authentication is required to control the agents.</p>
<form onsubmit="login(event)">
<input id="username" autocomplete="username" placeholder="Username" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div id="loginError"></div>
</section>

<main id="appView" style="display:none">
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3>Task</h3><button class="secondary" onclick="logout()">Logout</button></div>
<textarea id="task" placeholder="Tell the two AI workers what to do..."></textarea>
<button onclick="startTask()">Start Task</button>
<button id="forceStop" class="stop danger" onclick="forceStop()">FORCE STOP</button>
</div>

<div class="panel"><h3>Status</h3><div class="status" id="status">Loading...</div></div>

<div class="grid">
<div class="panel"><h3>Worker A</h3><div id="workerA">Idle</div></div>
<div class="panel"><h3>Worker B · Peer Critic</h3><div id="workerB">Idle</div></div>
</div>

<div class="panel owner" id="owner">
<h3>Owner decision required</h3>
<p>The peer workers reached the cycle budget without a PASS.</p>
<button onclick="decision('continue')">Continue another block</button>
<button class="stop" onclick="decision('stop')">Stop</button>
</div>

<div class="panel"><h3>Activity</h3><div class="log" id="log">Loading...</div></div>
</main>

<script>
function escapeHtml(value){return String(value||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
async function api(url, options={}){const response=await fetch(url,options);let data={};try{data=await response.json()}catch{}if(response.status===401){showLogin();throw new Error("Authentication required")};if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
function showLogin(){document.getElementById("loginView").style.display="block";document.getElementById("appView").style.display="none"}
function showApp(){document.getElementById("loginView").style.display="none";document.getElementById("appView").style.display="block"}
async function login(event){event.preventDefault();const error=document.getElementById("loginError");error.textContent="";try{await api("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});showApp();refresh()}catch(e){error.textContent=e.message}}
async function logout(){try{await api("/api/auth/logout",{method:"POST"})}finally{showLogin()}}
async function refresh(){try{const data=await api("/api/state");showApp();document.getElementById("status").innerHTML=`Status: <b>${escapeHtml(data.status)}</b><br>Cycle: <b>${data.cycle}/${data.maxCycles}</b><br>Worker A model: <b>${escapeHtml(data.models.workerA)}</b><br>Worker B model: <b>${escapeHtml(data.models.workerB)}</b>`;document.getElementById("workerA").innerHTML=`<b>${escapeHtml(data.workerAStatus)}</b><br><br>${escapeHtml(data.workerAMessage)}`;document.getElementById("workerB").innerHTML=`<b>${escapeHtml(data.workerBStatus)}</b><br><br>${escapeHtml(data.workerBMessage)}`;document.getElementById("owner").style.display=data.awaitingOwner?"block":"none";document.getElementById("forceStop").style.display=data.forceStoppable?"inline-block":"none";document.getElementById("log").textContent=data.events.map(e=>`[${new Date(e.time).toLocaleTimeString()}] ${e.type}/${e.actor}: ${e.message}`).join("\n")}catch(e){if(!e.message.includes("Authentication required"))document.getElementById("status").textContent=e.message}}
async function startTask(){const task=document.getElementById("task").value.trim();if(!task)return;try{await api("/api/task",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task})});refresh()}catch(e){alert(e.message)}}
async function decision(value){try{await api("/api/owner/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision:value})});refresh()}catch(e){alert(e.message)}}
async function forceStop(){if(!confirm("Force stop the current task? The active model request and running terminal command will be cancelled when possible."))return;try{await api("/api/force-stop",{method:"POST"});refresh()}catch(e){alert(e.message)}}
async function boot(){try{const s=await api("/api/auth/status");if(s.authenticated){showApp();refresh()}else showLogin()}catch(e){showLogin()}}
boot();setInterval(()=>{if(document.getElementById("appView").style.display!=="none")refresh()},1500);
</script>
</body>
</html>
